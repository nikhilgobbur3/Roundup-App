name: Email Outreach

on:
  schedule:
    # 08:00 IST = 02:30 UTC, right after the LinkedIn batch at 01:30 UTC
    - cron: '30 2 * * *'
  push:
    branches:
      - main
    paths:
      - 'scripts/email/**'
      - '.github/workflows/email-outreach.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  email:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Find emails, draft, and send
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          EMAIL_FROM_NAME: ${{ secrets.EMAIL_FROM_NAME }}
          EMAIL_FROM_ADDRESS: ${{ secrets.EMAIL_FROM_ADDRESS }}
          EMAIL_SEND_PER_DAY: ${{ vars.EMAIL_SEND_PER_DAY }}
          EMAIL_COMPANIES_PER_DAY: ${{ vars.EMAIL_COMPANIES_PER_DAY }}
        run: |
          node scripts/email/find-emails.mjs
          node scripts/email/draft-email.mjs
          node scripts/email/send-email.mjs

      - name: Sync progress to Notion
        env:
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/tracking/notion-sync.mjs

      - name: Commit email state
        run: |
          git config user.name "roundup-bot"
          git config user.email "roundup-bot@users.noreply.github.com"
          git add scripts/email/state.json scripts/email/pack.json
          git diff --cached --quiet || git commit -m "chore: update email state [skip ci]"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main >/dev/null 2>&1 || true
            git push >/dev/null 2>&1 && break
            sleep 2
          done
          true
